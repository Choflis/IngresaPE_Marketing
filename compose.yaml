services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ingresape_studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run setup}
    ports: ['127.0.0.1:5434:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d ingresape_studio']
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    profiles: ['app']
    image: ingresape-studio:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/ingresape_studio
      STORAGE_DIR: /app/storage
      NODE_ENV: production
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db: { condition: service_healthy }
    volumes: ['media_data:/app/storage']
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed && npm start']
    restart: unless-stopped
  worker:
    profiles: ['app']
    image: ingresape-studio:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/ingresape_studio
      STORAGE_DIR: /app/storage
      NODE_ENV: production
    depends_on:
      web: { condition: service_healthy }
    volumes: ['media_data:/app/storage']
    command: ['sh', '-c', 'npm run db:migrate && npm run worker']
    healthcheck:
      test: ['CMD', 'npm', 'run', 'worker:health']
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
    shm_size: 1gb
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
